<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tubi Dashboard Template</title>

<!-- Theme: keep this link, or paste tubi-theme.css inline inside <style> for one self-contained file -->
<link rel="stylesheet" href="tubi-theme.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="dash">

  <!-- ============ HEADER ============ -->
  <header class="dash-header">
    <span class="dash-logo">tubi</span>
    <h1 class="dash-title">Dashboard Title</h1>
    <div class="dash-header__spacer"></div>
    <div class="dash-toolbar">
      <button class="btn" id="themeBtn">Dark</button>
      <button class="btn" onclick="downloadChart('overviewChart','overview.png')">Export PNG</button>
    </div>
  </header>

  <!-- ============ FILTER BAR (functional) ============ -->
  <!-- Categorical <select>s are auto-populated from DATA via their data-field attr.
       Add/remove filters by copying a .filter block and setting data-field to a column name. -->
  <section class="filter-bar">
    <div class="filter">
      <label for="f_time">Time Period</label>
      <select id="f_time" data-field="__time">
        <option value="all">All time</option>
        <option value="12">Last 12 months</option>
        <option value="6">Last 6 months</option>
        <option value="3">Last 3 months</option>
      </select>
    </div>
    <div class="filter">
      <label for="f_partner">Partner Type</label>
      <select id="f_partner" data-field="partner"><option>(All)</option></select>
    </div>
    <div class="filter">
      <label for="f_content">Content Type</label>
      <select id="f_content" data-field="content"><option>(All)</option></select>
    </div>
  </section>

  <!-- Active cross-filters set by clicking a chart/row — always visible, always clearable.
       Every chart and table below is a filter on the whole dashboard by default. -->
  <div class="filter-chips" id="filterChips" hidden></div>

  <!-- ============ KPI ROW (rendered) — always first, before any chart ============ -->
  <section class="kpi-row" id="kpis"></section>

  <!-- ============ DEEP-DIVES: highest-level to most granular, top to bottom ============ -->

  <!-- Level 1 — aggregate: one summary chart across the whole filtered dataset -->
  <div class="section-band"><h2>Overview</h2></div>
  <div class="chart-card">
    <button class="sql-toggle" onclick="toggleSql(this)">SQL</button>
    <h3>Median Value Over Time</h3>
    <div class="chart-box"><canvas id="overviewChart"></canvas></div>
    <pre class="sql-block" data-sql-key="overview"></pre>
  </div>

  <!-- Level 2 — category breakdown: the same metric split by the primary dimension -->
  <div class="section-band"><h2>By Partner Type</h2></div>
  <div class="chart-grid chart-grid--2">
    <div class="chart-card">
      <button class="sql-toggle" onclick="toggleSql(this)">SQL</button>
      <h3>Median Value, Ranked</h3>
      <div class="chart-box"><canvas id="rankChart"></canvas></div>
      <pre class="sql-block" data-sql-key="rank"></pre>
    </div>
    <div class="chart-card">
      <button class="sql-toggle" onclick="toggleSql(this)">SQL</button>
      <h3>Share of Records</h3>
      <div class="chart-box"><canvas id="pieChart"></canvas></div>
      <pre class="sql-block" data-sql-key="share"></pre>
    </div>
  </div>

  <!-- Level 3 — record-level detail: the table a reader reaches for last, to check exact numbers -->
  <div class="section-band"><h2>Detail</h2></div>
  <div class="tbl-wrap" style="position:relative">
    <button class="sql-toggle" onclick="toggleSql(this)">SQL</button>
    <table class="tbl">
      <thead><tr><th>Partner Type</th><th>Count</th><th>Median Value</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <pre class="sql-block" data-sql-key="detail"></pre>
  </div>

</div>

<script>

/* ---- helpers ---- */
const fmt = n => (n==null ? '—' : n.toLocaleString('en-US'));   // integer counts: thousands separators
// Currency & decimals always render to 2 decimals. Use big() for large magnitudes
// (adds K/M/B suffix), money() for dollars, num2() for a plain 2-decimal number.
const big = n => { n = Number(n)||0; const a = Math.abs(n);
  if (a>=1e9) return (n/1e9).toFixed(2)+'B';
  if (a>=1e6) return (n/1e6).toFixed(2)+'M';
  if (a>=1e3) return (n/1e3).toFixed(2)+'K';
  return n.toFixed(2); };
const money = n => (n==null ? '—' : '$'+big(n));
const num2  = n => (n==null ? '—' : Number(n).toFixed(2));
const pct   = (n,d=1) => (n==null ? '—' : Number(n).toFixed(d)+'%');
function median(a){ a=a.filter(x=>x!=null).sort((p,q)=>p-q); if(!a.length) return null;
  const m=Math.floor(a.length/2); return a.length%2 ? a[m] : (a[m-1]+a[m])/2; }
const uniq = (arr,k) => [...new Set(arr.map(r=>r[k]).filter(x=>x!=null))].sort();

const PARTNERS = uniq(RAW,'partner');          // series + table rows

function toggleSql(btn){
  const block = btn.closest('.chart-card, .tbl-wrap').querySelector('.sql-block');
  block.classList.toggle('visible');

}
function copySql(btn){
  const block = btn.closest('.sql-block');
  const sql = block.textContent.replace('Copy', '').trim();

    btn.textContent = 'Copied!';

const CLICK_FILTERS = {};
function toggleClickFilter(field, value){
  if (CLICK_FILTERS[field] === value) delete CLICK_FILTERS[field];   // click again to clear
  else CLICK_FILTERS[field] = value;
  render();
}
function clearClickFilters(){ for (const k in CLICK_FILTERS) delete CLICK_FILTERS[k]; render(); }

  overviewChart = new Chart(overviewChart_ctx, { type:'line',
    data:{ labels, datasets:[{ label:'Median Value', data:overviewData,
      borderColor:v('--series-1'), backgroundColor:v('--series-1')+'30', borderWidth:2, fill:true, tension:.2, pointRadius:3 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      onClick:(e,els)=>{ if(!els.length) return; toggleClickFilter('month', overviewChart.data.labels[els[0].index]); },
      scales:{ y:{beginAtZero:true, grid:{color:v('--border')}}, x:{grid:{display:false}} } } });

  /* Level 2a: ranked bar by partner. Click a bar to filter to that partner. */
  const rankData = PARTNERS.map(p=>median(rows.filter(r=>r.partner===p).map(r=>r.value)));
  if (rankChart) rankChart.destroy();
  const horiz = PARTNERS.length>6;
  rankChart = new Chart(rankChart_ctx, { type:'bar',
    data:{ labels:PARTNERS, datasets:[{ data:rankData, backgroundColor:v('--series-1'), borderRadius:3 }] },
    options:{ indexAxis: horiz ? 'y' : 'x', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      onClick:(e,els)=>{ if(!els.length) return; toggleClickFilter('partner', rankChart.data.labels[els[0].index]); },
      scales:{ [horiz?'x':'y']:{beginAtZero:true, grid:{color:v('--border')}}, [horiz?'y':'x']:{grid:{display:false}} } } });

  /* Level 2b: share by partner. Click a slice to filter to that partner. */
  if (pieChart) pieChart.destroy();
  pieChart = new Chart(pieChart_ctx, { type:'doughnut',
    data:{ labels:PARTNERS, datasets:[{ data:PARTNERS.map(p=>rows.filter(r=>r.partner===p).length),
      backgroundColor:[v('--series-1'),v('--series-2'),v('--series-3'),v('--series-4')], borderColor:v('--bg'), borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      onClick:(e,els)=>{ if(!els.length) return; toggleClickFilter('partner', pieChart.data.labels[els[0].index]); } } });

  renderChips();   // keep active click-filters visible + clearable
  if (typeof writeUrl === 'function') writeUrl();   // persist filter state in URL
}

const overviewChart_ctx = document.getElementById('overviewChart');
const rankChart_ctx     = document.getElementById('rankChart');
const pieChart_ctx      = document.getElementById('pieChart');
f_time.addEventListener('change', render);

/* ---- dark theme toggle ---- */
themeBtn.addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? '' : 'dark');
  themeBtn.textContent = dark ? 'Dark' : 'Light';
  render();
});

/* ---- export chart to PNG ---- */
function downloadChart(canvasId, filename){
  const a = document.createElement('a');
  a.href = document.getElementById(canvasId).toDataURL('image/png', 1);
  a.download = filename; a.click();
}

/* ---- URL state: persist filters so a pre-filtered view is shareable ---- */
function writeUrl(){
  const p = new URLSearchParams();
  document.querySelectorAll('select[id^="f_"]').forEach(s => p.set(s.id, s.value));
  Object.entries(CLICK_FILTERS).forEach(([k, val]) => p.set('cf_' + k, val));
  const theme = document.documentElement.getAttribute('data-theme');
  if (theme) p.set('theme', theme);
  history.replaceState(null, '', '?' + p.toString());
}
function readUrl(){
  const p = new URLSearchParams(location.search);
  p.forEach((val, key) => {
    if (key.startsWith('cf_')) { CLICK_FILTERS[key.slice(3)] = val; return; }
    if (key === 'theme') {
      document.documentElement.setAttribute('data-theme', val);
      themeBtn.textContent = val === 'dark' ? 'Light' : 'Dark';
      return;
    }
    const el = document.getElementById(key);
    if (el) el.value = val;
  });
}

readUrl();
render();   // initial paint
</script>
</body>
