name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `...`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of {{PROJECT_NAME}} are you using?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and {{RUNTIME_NAME}} version
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
