# Review Gate — required check on PR head (trusted workflow code only).
# Installed from bernierllc/claude-skills skill `review-gate`.
# Pair with GitHub ruleset pull_request.required_review_thread_resolution: true.
#
# Security: only `pull_request_target` so the workflow file always comes from the
# PR base (never the merge commit). Same-repo `pull_request_review` /
# `pull_request_review_comment` would run PR-modified workflow YAML with
# checks/actions write — removed on purpose. Gate jobs never execute PR-head
# or untrusted-base code; they load scripts/check-review-gate.py exclusively
# from the repository default branch (a PR base ref can be a contributor-
# controlled branch when the PR targets a non-default base).
#
# Stale-check residual: review/thread events are intentionally not triggers, so
# a green "Review Gate" on a head SHA can outlive a later P2 thread. Mitigations:
# (1) PreToolUse merge-guard re-runs the checker live before `gh pr merge`;
# (2) after any thread change without a push, re-fire via label toggle or PR
# body edit (agents: adversarial-review). Do not reintroduce review-event
# workflow triggers.
#
# Required-check context is the Checks API check run named "Review Gate"
# published on pull_request.head.sha (Actions job alone attaches to the base).
#
# Forged-name check (SEC-MVS-01 S5): required checks match by name, so a same-repo
# PR can add its own job named "Review Gate" with `run: true`. After the checker,
# scripts/check-forged-review-gate.py (vendored aec detector, scoped to this name)
# lists the head SHA's check runs and fails the gate when any Actions job published
# "Review Gate". The real result is only the Checks API run below; this workflow's
# own job is named review-gate-runner, because under pull_request_target it attaches
# to the base SHA, and a stacked child PR's base is the outer PR's head. Runs for
# PRs into every branch. Residual: a PR job with `checks: write` POSTing the name
# straight to the Checks API is not detectable here (needs a required workflow or a
# distinct publisher app). A job publishing after this scan is caught by the
# merger's own pre-merge run of the detector.
name: Review Gate

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read  # forged-check step looks up which workflow/event ran a job

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Not "Review Gate": this job attaches to the base SHA, which can be a stacked PR's head.
    name: review-gate-runner
    runs-on: ubuntu-latest
    steps:
      - name: Run trusted review-gate checker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Invalidate any prior same-head success before reevaluation (edited /
          # unlabeled / …). Required checks stay pending until we complete below.
          check_id=$(gh api -X POST "repos/$REPO/check-runs" \
            -f name="Review Gate" \
            -f head_sha="$SHA" \
            -f status="in_progress" \
            -f "output[title]=review-gate running" \
            -f "output[summary]=Reevaluating review gate…" \
            --jq .id)
          complete_check() {
            local conclusion="$1" title="$2" summary="$3"
            gh api -X PATCH "repos/$REPO/check-runs/$check_id" \
              -f status="completed" \
              -f conclusion="$conclusion" \
              -f "output[title]=$title" \
              -f "output[summary]=$summary"
          }
          # Only the default branch is trusted for the checker binary. A PR can
          # target any same-repo branch; that base SHA is not necessarily protected.
          ref="$DEFAULT_BRANCH"
          load_trusted() {
            local name="$1" meta msg
            if meta=$(gh api "repos/$REPO/contents/scripts/$name?ref=$ref" 2>/dev/null); then
              printf '%s' "$meta" | jq -r '.content' | base64 -d > "/tmp/$name"
              echo "Loaded trusted $name from ref=$ref"
            else
              msg=$(printf '%s\n%s' \
                "Missing trusted scripts/$name on default branch $DEFAULT_BRANCH." \
                "Run install-workflow.py and merge it to the default branch.")
              printf '%s\n' "$msg"
              complete_check failure "review-gate failed" "$msg"
              exit 1
            fi
          }
          load_trusted check-review-gate.py
          load_trusted check-forged-gate-names.py
          load_trusted check-forged-review-gate.py
          set +e
          out=$(python3 /tmp/check-review-gate.py --pr "$PR_NUMBER" --repo "$REPO" 2>&1)
          rc=$?
          # pipefail (set above) keeps a failed or truncated listing from reaching
          # the detector as empty input. Any non-zero result fails the gate.
          forged=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100&filter=all" --paginate \
            | REPO="$REPO" python3 /tmp/check-forged-review-gate.py 2>&1)
          frc=$?
          set -e
          if [ "$frc" -ne 0 ]; then
            out=$(printf '%s\n%s\n%s' "$out" "forged-check step failed (exit $frc):" "$forged")
            [ "$rc" -ne 0 ] || rc=1
          fi
          printf '%s\n' "$out"
          # pull_request_target attaches the Actions job to the base SHA — always
          # publish Checks API on the PR head for the required-check context.
          summary=${out:0:60000}  # no pipe: head closing early SIGPIPEs under pipefail
          if [ "$rc" -eq 0 ]; then
            complete_check success "review-gate ok" "$summary"
          else
            complete_check failure "review-gate failed" "$summary"
          fi
          exit "$rc"
