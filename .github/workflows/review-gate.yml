# Review Gate — required check on PR head (trusted workflow code only).
# Installed from bernierllc/claude-skills skill `review-gate`.
# Pair with GitHub ruleset pull_request.required_review_thread_resolution: true.
#
# Security: only `pull_request_target` so the workflow file always comes from the
# repository default branch, whatever the PR base (never the merge commit; seen live:
# review-gate-sandbox PR #27, base repro-api, ran main's file in run 43982863036). Same-repo `pull_request_review` /
# `pull_request_review_comment` would run PR-modified workflow YAML with
# checks/actions write — removed on purpose. Gate jobs never execute PR-head
# or untrusted-base code; they load scripts/check-review-gate.py exclusively
# from the repository default branch (a PR base ref can be a contributor-
# controlled branch when the PR targets a non-default base).
#
# Stale-check residual: review/thread events are intentionally not triggers, so
# a green "Review Gate" on a head SHA can outlive a later P2 thread. Mitigations:
# (1) PreToolUse merge-guard re-runs the checker live before `gh pr merge`;
# (2) after any thread change without a push, re-fire via label toggle or PR
# body edit (agents: adversarial-review). Do not reintroduce review-event
# workflow triggers.
#
# Required-check context is this workflow's own job, named "Review Gate" (3.2.8). A
# pull_request_target job's check run is on pull_request.head.sha, in this run's own
# check suite (email_demo #1068), which is the suite the required-status rule reads.
# 3.2.0-3.2.7 named the job review-gate-runner and POSTed the result through the
# Checks API instead, on the false premise that the job attaches to the base SHA; a
# POST lands in the head's OLDEST suite (any workflow's), so the rule read "expected".
#
# Forged-name check (SEC-MVS-01 S5): required checks match by name, so a same-repo
# PR can add its own job named "Review Gate" with `run: true`. After the checker,
# scripts/check-forged-review-gate.py (vendored aec detector, scoped to this name)
# lists the head SHA's check runs and fails the gate when an Actions job other than
# this workflow's (review-gate.yml, pull_request_target) published "Review Gate", or
# when another PR shares the head. Runs for PRs into every branch. Residual: a PR job
# with `checks: write` POSTing the name straight to the Checks API is not detectable
# here (needs a required workflow or a distinct publisher app). A job publishing
# after this scan is caught only if whoever merges runs the detector by hand
# (pr-merge-flow rule 2). The merge-guard hook does NOT run it.
name: Review Gate
# Names the PR in the Actions run list. Quoted: unquoted, YAML reads " #" as a comment (3.2.7).
run-name: "Review Gate - PR #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read  # forged-check step looks up which workflow/event ran a job

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # This job IS the required check: its exit code is the gate result (3.2.8).
    name: Review Gate
    runs-on: ubuntu-latest
    steps:
      - name: Run trusted review-gate checker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # 3.2.0-3.2.7 POSTed `Review Gate` check runs (external_id review-gate-pr-<n>). None are created
          # any more; every evaluation completes this PR's existing ones with its own result, so no stale
          # red or green API run stays standing beside the job. Two PRs can share a head sha: other-PR
          # or unmarked runs, and same-named Actions jobs (.../actions/runs/<n>/job/<m>), are never touched.
          external_id="review-gate-pr-$PR_NUMBER"
          # Every API call goes through api(): a failure names the method and endpoint in the log and
          # returns gh's status. Any API error fails this job, which IS the check, so the result is a
          # terminal failure even when the Checks API itself is down (nevar-auth #26: a bare
          # "gh: Not Found (HTTP 404)" from 3.2.7 left its POSTed run queued with no endpoint named).
          api() {
            local method="$1" endpoint="$2" rc
            shift 2
            if gh api -X "$method" "$endpoint" "$@"; then return 0; else rc=$?; fi
            echo "::error::review-gate: gh api $method $endpoint failed (exit $rc)" >&2
            return "$rc"
          }
          list_runs() {
            api GET "repos/$REPO/commits/$SHA/check-runs?check_name=Review%20Gate&filter=all&per_page=100" --paginate \
              | jq -r --arg ext "$external_id" '.check_runs[]
                       | select(.name == "Review Gate" and .app.slug == "github-actions" and .external_id == $ext)
                       | select((.details_url // "") | test("/actions/runs/[0-9]+/job/") | not)
                       | .id'
          }
          # Completes this PR's legacy runs with the given result. Returns non-zero when they cannot be
          # listed or completed; the caller then fails the job. Cleanup itself is best effort: with the
          # API down, a legacy run keeps its old state, and the failed job is what blocks the merge.
          complete_check() {
            local conclusion="$1" title="$2" summary="$3" listed id
            if ! listed=$(list_runs); then
              echo "::error::review-gate: could not list legacy Review Gate check runs on $SHA" >&2
              return 1
            fi
            for id in $listed; do
              api PATCH "repos/$REPO/check-runs/$id" \
                -f status="completed" \
                -f conclusion="$conclusion" \
                -f "output[title]=$title" \
                -f "output[summary]=$summary" >/dev/null || return 1
            done
          }
          # Invalidate any prior same-head legacy API success before reevaluation: red until completed below.
          complete_check failure "review-gate running" "Reevaluating review gate…" || exit 1
          # Only the default branch is trusted for the checker binary. A PR can
          # target any same-repo branch; that base SHA is not necessarily protected.
          ref="$DEFAULT_BRANCH"
          load_trusted() {
            local name="$1" meta msg
            # An empty or absent .content (a file over 1 MB) would run an empty script that exits 0: fail closed.
            if meta=$(api GET "repos/$REPO/contents/scripts/$name?ref=$ref") \
              && printf '%s' "$meta" | jq -r '.content // empty' | base64 -d > "/tmp/$name" && [ -s "/tmp/$name" ]; then
              echo "Loaded trusted $name from ref=$ref"
            else
              msg=$(printf '%s\n%s' \
                "Could not load trusted scripts/$name from default branch $DEFAULT_BRANCH (see the API error above, or it was empty)." \
                "If it is missing, run install-workflow.py and merge it to the default branch.")
              printf '%s\n' "$msg"
              complete_check failure "review-gate failed" "$msg" || true  # the job fails either way
              exit 1
            fi
          }
          load_trusted check-review-gate.py
          load_trusted check-forged-gate-names.py
          load_trusted check-forged-review-gate.py
          set +e
          out=$(python3 /tmp/check-review-gate.py --pr "$PR_NUMBER" --repo "$REPO" 2>&1)
          rc=$?
          # pipefail (set above) keeps a failed or truncated listing from reaching
          # the detector as empty input. Any non-zero result fails the gate.
          forged=$(api GET "repos/$REPO/commits/$SHA/check-runs?per_page=100&filter=all" --paginate \
            | REPO="$REPO" python3 /tmp/check-forged-review-gate.py 2>&1)
          frc=$?
          set -e
          if [ "$frc" -ne 0 ]; then
            out=$(printf '%s\n%s\n%s' "$out" "forged-check step failed (exit $frc):" "$forged")
            [ "$rc" -ne 0 ] || rc=1
          fi
          printf '%s\n' "$out"
          summary=${out:0:60000}  # no pipe: head closing early SIGPIPEs under pipefail
          if [ "$rc" -eq 0 ]; then conclusion=success; title="review-gate ok"; else conclusion=failure; title="review-gate failed"; fi
          if ! complete_check "$conclusion" "$title" "$summary"; then
            echo "::error::review-gate: legacy Review Gate runs on $SHA were not all completed; failing closed" >&2
            rc=1
          fi
          exit "$rc"
