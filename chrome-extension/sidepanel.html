<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; margin: 0; }
    h2 { font-size: 16px; margin-top: 0; }
    textarea { width: 100%; height: 200px; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 8px; width: 100%; }
    button:hover { background: #0052a3; }
    #result { margin-top: 16px; white-space: pre-wrap; font-size: 14px; }
  </style>
</head>
<body>
  <h2>BrianJosh Audit Engine</h2>
  <textarea id="selectionBox" placeholder="Highlight a job description and right-click 'Send to BrianJosh' to load it here..."></textarea>
  <button id="auditBtn">Run BrianJosh Audit</button>
  <div id="result"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
